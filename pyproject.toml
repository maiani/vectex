[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vectex"
version = "0.1.0"
description = "Render LaTeX or Typst as portable, editable SVG group fragments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrea Maiani", email = "dev@andreamaiani.com" }]
license = "MIT"
keywords = ["latex", "typst", "svg", "vector-graphics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["lxml>=5.0", "typer>=0.12"]

[project.scripts]
vectex = "vectex.cli:app"

[project.urls]
Documentation = "https://maiani.github.io/vectex/"
Issues = "https://github.com/maiani/vectex/issues"
Source = "https://github.com/maiani/vectex"

[project.optional-dependencies]
svg-py = ["svg.py>=1.5"]
drawsvg = ["drawsvg>=2.0"]
all = ["svg.py>=1.5", "drawsvg>=2.0"]

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "zensical>=0.0.57,<0.1",
  "types-lxml>=2025.3.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vectex"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AGENTS.md",
  "/docs",
  "/pixi.toml",
  "/pyproject.toml",
  "/recipe",
  "/zensical.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires explicitly enabled external rendering tools"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["vectex"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["vectex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
