[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vectex"
version = "0.3.0"
description = "Render LaTeX as portable, editable SVG group fragments"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andrea Maiani", email = "dev@andreamaiani.com" }]
license = "MIT"
keywords = ["latex", "svg", "vector-graphics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Typing :: Typed",
]
dependencies = ["lxml>=5.0", "typer>=0.12"]

[project.scripts]
vectex = "vectex.cli:app"

[project.urls]
Documentation = "https://maiani.github.io/vectex/"
Issues = "https://github.com/maiani/vectex/issues"
Source = "https://github.com/maiani/vectex"

[project.optional-dependencies]
svg-py = ["svg.py>=1.5"]
drawsvg = ["drawsvg>=2.0"]
all = ["svg.py>=1.5", "drawsvg>=2.0"]
# Example-only: `--png` rasterizes, which the package itself never does.
examples = ["cairosvg>=2.7"]

[dependency-groups]
dev = [
  "build>=1.2",
  "ty>=0.0.84",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
  "zensical>=0.0.57,<0.1",
  "types-lxml>=2025.3.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vectex"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/AGENTS.md",
  "/docs",
  "/pyproject.toml",
  "/zensical.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires explicitly enabled external rendering tools"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Keep library signatures annotated; ty checks their types.
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"examples/**" = ["ANN", "S101"]

[tool.ty.src]
include = ["src", "examples"]

[tool.coverage.run]
branch = true
source = ["vectex"]

[tool.coverage.report]
show_missing = true
skip_covered = true
