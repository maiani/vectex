context:
  version: "0.1.0"

package:
  name: vectex
  version: ${{ version }}

source:
  path: ..

build:
  noarch: python
  script:
    - python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.27
  run:
    - python >=3.10
    - lxml >=5.0

tests:
  - python:
      imports:
        - vectex
      pip_check: true

about:
  homepage: https://github.com/maiani/vectex
  repository: https://github.com/maiani/vectex
  documentation: https://maiani.github.io/vectex/
  license: MIT
  license_file: LICENSE
  summary: Render LaTeX or Typst as portable, editable SVG group fragments
