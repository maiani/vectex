[workspace]
name = "vectex"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
lxml = ">=5.0"
pip = "*"

[pypi-dependencies]
vectex = { path = ".", editable = true, extras = ["all"] }
build = ">=1.2"
mypy = ">=1.10"
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.12"
types-lxml = ">=2025.3.30"

[tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy src"
test = "pytest"
build = "python -m build"
check = { depends-on = ["format-check", "lint", "typecheck", "test", "build"] }
