name: Test

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test when called by another workflow.
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade build mypy pytest ruff
          types-lxml zensical '.[all]'

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Build documentation
        run: python -m zensical build
